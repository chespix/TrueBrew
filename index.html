<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.webp" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f0ece4" />
    <!-- Instant theme init: runs before React to prevent dark flash -->
    <script>
      (function () {
        var t = localStorage.getItem('tb_theme');
        // Default is light; only go dark if explicitly saved as 'dark'
        if (t !== 'dark') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta name="description" content="TrueBrew: Mapa colaborativo de cafés de especialidad en Buenos Aires. Votá y descubrí los mejores cafés de CABA." />
    <title>TrueBrew — Café de Especialidad CABA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
